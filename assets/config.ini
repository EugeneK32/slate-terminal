[Appearance]
# Change this here or in Slate Preferences (Ctrl+,).
font=Adwaita Mono 12
background=#1e1e1e
foreground=#e7e7e7
# Extra row height fixes clipped top-of-glyphs with some fonts.
line_spacing=1.16
padding=12

[Graphics]
# cairo = stable software rendering; gl/vulkan = accelerated alternatives.
# Requires restarting the application.
renderer=cairo

[Terminal]
# Empty = login shell (for example, Zsh when set by chsh).
shell=
